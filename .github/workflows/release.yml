name: Release extension artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix), for example 0.1.0'
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Resolve and validate release version
        id: version
        run: |
          manifest_version="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('./extension/manifest.json', 'utf8')).version)")"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_version="${{ github.event.inputs.version }}"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi

          if [ "${manifest_version}" != "${release_version}" ]; then
            echo "manifest.json version (${manifest_version}) does not match release version (${release_version})" >&2
            exit 1
          fi

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build extension bundle
        working-directory: extension
        run: npm run build

      - name: Verify generated bundle is up to date
        run: git diff --exit-code -- extension/content.js

      - name: Create reproducible artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          artifact_dir="dist/uncensored-extension-v${RELEASE_VERSION}"
          zip_path="dist/uncensored-extension-v${RELEASE_VERSION}.zip"
          source_date_epoch="$(git log -1 --pretty=%ct)"

          rm -rf dist
          mkdir -p "${artifact_dir}"
          rsync -a --exclude node_modules extension/ "${artifact_dir}/"

          find "${artifact_dir}" -exec touch -d "@${source_date_epoch}" {} +

          (
            cd "${artifact_dir}"
            find . -type f | LC_ALL=C sort | zip -X "../$(basename "${zip_path}")" -@
          )

      - name: Upload unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: uncensored-extension-v${{ steps.version.outputs.release_version }}-unpacked
          path: dist/uncensored-extension-v${{ steps.version.outputs.release_version }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: uncensored-extension-v${{ steps.version.outputs.release_version }}-zip
          path: dist/uncensored-extension-v${{ steps.version.outputs.release_version }}.zip
